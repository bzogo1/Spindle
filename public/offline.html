<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f0e" />
    <title>Offline — Spindle</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d0f0e;
        color: #e8ebe7;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 2rem;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        border-radius: 18px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 0.5rem;
      }
      p {
        color: #9aa39b;
        line-height: 1.6;
        margin: 0 0 1.75rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #7ee0a3;
        color: #0d0f0e;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon.svg" alt="" width="72" height="72" />
      <h1>You&rsquo;re offline</h1>
      <p>
        Spindle can&rsquo;t reach the network right now. Reconnect and try again — pages you
        visited recently may still be available from this device.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
