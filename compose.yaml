services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spindle
      POSTGRES_PASSWORD: spindle
      POSTGRES_DB: spindle
    ports:
      - "5432:5432"
    volumes:
      - spindle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spindle -d spindle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spindle-postgres:
