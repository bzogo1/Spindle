# Grafana datasource provisioning for the OPTIONAL local observability stack.
# Both datasources are compose service names on the spindle-observability
# network — they do not resolve from the host or the origin stack.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true

  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
