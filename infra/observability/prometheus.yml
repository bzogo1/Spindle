# Prometheus config for the OPTIONAL local observability stack.
# Scrape targets are compose service names — they resolve on the
# spindle-observability network only.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/spindle-alerts.yml

scrape_configs:
  # Log-derived metrics: request rate/errors/latency + config metrics from
  # scripts/metrics/log-metrics.mjs, served by scripts/observability/serve-metrics.mjs.
  - job_name: spindle-log-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["log-metrics-exporter:9100"]
        labels:
          source: ship-jsonl

  # Self-metrics of the stack itself.
  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
