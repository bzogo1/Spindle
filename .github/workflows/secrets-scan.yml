name: Secrets scan

# Dedicated credential-scanning workflow. It complements the `secrets` job in
# ci.yml: that job is fast hygiene; this one runs the full gitleaks ruleset
# against the entire history on every push and PR.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Needed only if SARIF results are uploaded to the Security tab later.
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks scans commit history, so the default shallow clone is not
          # enough on push; pull_request checkouts already carry history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fast dependency-free pre-check: fails fast on obviously leaked tokens
      # and keeps .env/.gitignore hygiene honest before gitleaks runs.
      - name: Check repository secret hygiene
        run: node scripts/secrets/scan.mjs

      # gitleaks-action downloads a pinned gitleaks binary and honours the
      # repo's .gitleaks.toml automatically. GITLEAKS_ENABLE_SUMMARY adds the
      # findings table to the job summary. To upload results to the Security
      # tab as SARIF, point actions/upload-artifact or the code-scanning API
      # at the report the action produces; security-events: write is already
      # granted for that.
      - name: Scan commits for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
