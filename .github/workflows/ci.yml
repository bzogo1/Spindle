name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in progress, so reviewers
# get results for the latest commit instead of waiting on stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check repository secret hygiene
        run: node scripts/secrets/scan.mjs

      - name: Scan commits for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vitest.config.mts enforces calibrated per-glob coverage thresholds
      # (src/lib ~85/84/70/83, src/{components,hooks} ~70/70/60/70); a coverage
      # run executes the full suite, so this replaces a separate `npm test`.
      - name: Run unit tests with coverage
        run: npm run test:coverage

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Compiles every story; a broken component or story fails the build.
      - name: Build Storybook
        run: npm run build-storybook

      # Vitest browser mode runs every story (incl. play functions) in
      # headless Chromium; --with-deps installs the OS libraries it needs.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: npm run test:storybook

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spindle
          POSTGRES_PASSWORD: spindle
          POSTGRES_DB: spindle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spindle -d spindle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://spindle:spindle@localhost:5432/spindle?schema=public
      DIRECT_URL: postgresql://spindle:spindle@localhost:5432/spindle?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to an ephemeral database
        run: npm run db:deploy

      - name: Seed the development user
        run: npm run db:seed

      - name: Check migrations match the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  build-and-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SITE_URL: https://spindle.app
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check environment access
        run: |
          # Generated Prisma sources contain `process.env` only inside doc comments.
          if grep -RInE --include='*.ts' --include='*.tsx' 'process\.env' src next.config.ts \
            | grep -vE '^src/(lib/env(\.server)?\.ts|generated/.*):'; then
            echo "Read environment variables through src/lib/env.ts." >&2
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test infrastructure page
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/infrastructure > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Server did not become ready in time." >&2
              exit 1
            fi
            sleep 1
          done

          INFRA_URL=http://127.0.0.1:3000/infrastructure npm run test:e2e

          # axe-core audit of the public routes against the production build.
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm run test:e2e:a11y

          # Password-recovery/email-verification flows are public (auth)
          # routes on the in-memory auth backend — no mock auth or database
          # required, so they are safe against the production build.
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/auth-recovery.spec.ts

          # Public marketing routes are static and need no mock auth or
          # database, so they are safe against the production build too.
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test e2e/route-smoke.spec.ts

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

  e2e:
    name: End-to-end (mock auth)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: https://spindle.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # PLAYWRIGHT_BASE_URL is intentionally unset: playwright.config.ts boots
      # its own dev server with NEXT_PUBLIC_MOCK_AUTH=1 (a build-time flag the
      # production build lacks), which the (app) route group and the
      # mock-session cookie require. critical-flows covers sign-in, project
      # create, file upload and a lab run; app-a11y axe-scans the (app)
      # routes. route-smoke hits the public marketing surface on the same dev
      # server. viewport-matrix sweeps the responsive surface across viewports
      # for horizontal overflow. Visual regression stays in visual.yml.
      # Note: viewport-matrix may currently fail on known overflow issues
      # (header / product-window / globe) until those fixes land.
      - name: Run critical flows, app a11y, route smoke and viewport matrix
        run: npx playwright test e2e/critical-flows.spec.ts e2e/app-a11y.spec.ts e2e/route-smoke.spec.ts e2e/viewport-matrix.spec.ts
